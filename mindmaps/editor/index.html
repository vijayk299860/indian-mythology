<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔱 Sanātana Universe — Mind Map Editor</title>
    <meta name="description"
        content="Dynamic mind map editor for the Cosmic Architecture of Sanātana Universe animation project.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Toolbar -->
    <header id="toolbar">
        <div class="toolbar-left">
            <h1>🔱 Mind Map Editor</h1>
            <span class="subtitle">Sanātana Universe</span>
        </div>
        <div class="toolbar-actions">
            <button id="btn-collapse-all" title="Collapse All">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 14h16M4 10h16" />
                </svg>
                Collapse
            </button>
            <button id="btn-expand-all" title="Expand All">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 8h16M4 16h16M12 4v4M12 16v4" />
                </svg>
                Expand
            </button>
            <div class="toolbar-divider"></div>
            <button id="btn-export-json" title="Export as JSON">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" />
                </svg>
                Export JSON
            </button>
            <button id="btn-import-json" title="Import JSON">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12" />
                </svg>
                Import JSON
            </button>
            <input type="file" id="file-import" accept=".json" style="display:none">
            <button id="btn-export-html" title="Export as Mind Map HTML">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" />
                </svg>
                Export HTML
            </button>
            <div class="toolbar-divider"></div>
            <button id="btn-reset" class="btn-danger" title="Reset to Default">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                Reset
            </button>
        </div>
    </header>

    <main id="app">
        <!-- Left Panel: Tree Editor -->
        <aside id="panel-left">
            <div class="panel-header">
                <h2>📂 Tree Editor</h2>
                <button id="btn-add-root-child" class="btn-small btn-primary" title="Add child to root">+ Add
                    Branch</button>
            </div>
            <div id="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="search-input" placeholder="Search nodes...">
            </div>
            <div id="tree-container"></div>
        </aside>

        <!-- Resize Handle -->
        <div id="resize-handle"></div>

        <!-- Right Panel: Mind Map + Editor -->
        <section id="panel-right">
            <!-- Node Editor (shows when a node is selected) -->
            <div id="node-editor" class="hidden">
                <div class="editor-header">
                    <h3 id="editor-title">Edit Node</h3>
                    <button id="btn-close-editor" class="btn-icon" title="Close editor">✕</button>
                </div>
                <div class="editor-body">
                    <div class="form-group">
                        <label for="edit-title">Title</label>
                        <input type="text" id="edit-title" placeholder="Node title...">
                    </div>
                    <div class="form-group">
                        <label for="edit-description">Description / Story</label>
                        <textarea id="edit-description" rows="4"
                            placeholder="Add description, story, notes..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="edit-tag">Source Tag</label>
                            <select id="edit-tag">
                                <option value="">None</option>
                                <option value="S">📜 [S] Shruti</option>
                                <option value="P">📕 [P] Purana</option>
                                <option value="I">⚔️ [I] Itihasa</option>
                                <option value="Ph">🧠 [Ph] Philosophy</option>
                                <option value="R">🗣️ [R] Regional</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="edit-status">Status</label>
                            <select id="edit-status">
                                <option value="">None</option>
                                <option value="verified">✅ Verified</option>
                                <option value="warning">⚠️ Needs Review</option>
                            </select>
                        </div>
                    </div>
                    <div class="editor-actions">
                        <button id="btn-add-child" class="btn-primary">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                            Add Child
                        </button>
                        <button id="btn-delete-node" class="btn-danger">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" />
                            </svg>
                            Delete
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mind Map Visualization -->
            <div id="mindmap-container">
                <svg id="mindmap-svg"></svg>
            </div>

            <!-- Stats bar -->
            <div id="stats-bar">
                <span id="stat-nodes">Nodes: 0</span>
                <span id="stat-branches">Branches: 0</span>
                <span id="stat-tagged">Tagged: 0</span>
                <span class="stat-hint">Click a node in the tree to edit • Double-click on map to zoom</span>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
